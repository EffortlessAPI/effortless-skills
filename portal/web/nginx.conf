server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any non-file route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the api service so the browser only ever
    # talks to this one origin (avoids CORS entirely).
    location /api/ {
        proxy_pass http://api:5177/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
